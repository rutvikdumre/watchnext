{% extends 'main/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login · watchNext{% endblock %}
{% block body %}
<main class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your watchNext account</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn-wn">Log in</button>
    </form>
    <p class="alt">New here? <a href="/register/">Create an account</a></p>
    <p class="alt" style="margin-top:6px"><a href="/index/">Continue as guest →</a></p>
  </div>
</main>
{% endblock %}
