{% extends 'main/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign up · watchNext{% endblock %}
{% block body %}
<main class="auth-wrap">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="sub">It takes 20 seconds. Or just browse as a guest.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn-wn">Sign up</button>
    </form>
    <p class="alt">Already have an account? <a href="/login/">Log in</a></p>
    <p class="alt" style="margin-top:6px"><a href="/index/">Continue as guest →</a></p>
  </div>
</main>
{% endblock %}
