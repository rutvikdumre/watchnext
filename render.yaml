services:
  - type: web
    name: watchnext
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn watchnext.wsgi --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Free Postgres from neon.tech (or any Postgres URL). Without it, data lives in
      # SQLite on Render's temporary disk and is wiped whenever the server restarts.
      - key: DATABASE_URL
        sync: false
